name: Embassy Dispatch

# Copie este arquivo para .github/workflows/embassy.yml no repo do corpo.
# Configure o secret EMBASSY_PAT nas settings do repo (PAT matrix-dev-workstation).
# Ajuste o valor de `corpo` para o nome deste corpo celestial.

on:
  push:
    branches:
      - master
      - main
    # Só pushes que alteram arquivos significativos — evita ruído de docs/config menores
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "docs/**"
      - "*.lock"
      - "*.log"

  issues:
    types:
      - closed

  release:
    types:
      - published

jobs:
  embassy:
    # Não disparar em forks: só roda quando o dono do repo é uma das orgs abaixo.
    # ← substituir pela sua org (ou orgs). Deixar o valor de outra pessoa aqui faz
    #   o workflow nunca disparar, em silêncio — é a falha mais fácil de não notar
    #   ao copiar este template.
    if: github.repository_owner == 'SUA_ORG'
    uses: paulinett1508-dev/agnostic-core/.github/workflows/embassy-dispatch.yml@master
    with:
      corpo: "NOME_DO_CORPO"   # ← substituir pelo nome do repo/serviço que dispara
    secrets:
      EMBASSY_PAT: ${{ secrets.EMBASSY_PAT }}
