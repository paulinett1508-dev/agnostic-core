name: Check Links

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Segunda-feira 03:00 UTC - captura link rot em refs externas
    - cron: '0 3 * * 1'

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 202 na lista de aceitos: o servidor aceitou a requisicao, ou seja, o
      # link existe. Sites com protecao contra bot respondem assim em vez de
      # 200 — dribbble.com, citado em skills/design-system, e o caso aqui.
      # Tratar 202 como quebrado deixava o CI vermelho por link saudavel, e
      # alerta que vive vermelho para de ser sinal.
      # Falsos positivos (placeholders, templates, IPs de metadata) ficam em
      # lychee.toml na raiz, lido automaticamente pelo lychee.
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,202,204,206,301,302,304,403,429
            --exclude-loopback
            --max-concurrency 4
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
