# ==============================================================================
# Template: Atualizar agnostic-core automaticamente
# ==============================================================================
#
# COMO USAR:
# 1. Copie este arquivo para o SEU projeto em .github/workflows/
# 2. Ajuste o cron se quiser outra frequencia
# 3. Certifique-se de que GITHUB_TOKEN tem permissao para criar PRs
#
# O workflow cria um Pull Request (nao push direto) para que o time
# possa revisar as mudancas antes de absorver a nova versao.
# ==============================================================================

name: Atualizar agnostic-core

on:
  schedule:
    - cron: '0 8 * * 1'   # toda segunda-feira as 8h UTC
  workflow_dispatch:        # permite execucao manual

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com submodulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capturar versao atual
        id: before
        run: |
          cd .agnostic-core
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION 2>/dev/null || echo 'sem versao')" >> "$GITHUB_OUTPUT"

      - name: Atualizar submodulo
        run: git submodule update --remote .agnostic-core

      - name: Capturar versao nova
        id: after
        run: |
          cd .agnostic-core
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION 2>/dev/null || echo 'sem versao')" >> "$GITHUB_OUTPUT"

      - name: Verificar se houve mudanca
        id: check
        run: |
          if git diff --quiet .agnostic-core; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma atualizacao disponivel."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Atualizacao encontrada."
          fi

      # Valores vindos do submodulo (VERSION, mensagens de commit) sao dados
      # externos: entram so via env e variavel entre aspas, nunca via ${{ }}
      # direto no script, e o corpo do PR vai por arquivo (--body-file).
      - name: Gerar resumo de mudancas
        if: steps.check.outputs.changed == 'true'
        env:
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          AFTER_SHA: ${{ steps.after.outputs.sha }}
        run: |
          cd .agnostic-core
          git log --oneline "${BEFORE_SHA}..${AFTER_SHA}" | head -20 > "$RUNNER_TEMP/changelog.txt"

      - name: Criar branch e Pull Request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.before.outputs.version }}
          NEW_VERSION: ${{ steps.after.outputs.version }}
          OLD_SHORT: ${{ steps.before.outputs.short }}
          NEW_SHORT: ${{ steps.after.outputs.short }}
        run: |
          valida() { [[ "$1" =~ ^[0-9A-Za-z._\ -]{1,40}$ ]] || { echo "Valor invalido: $1"; exit 1; }; }
          valida "$OLD_VERSION"; valida "$NEW_VERSION"

          BRANCH="chore/update-agnostic-core-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .agnostic-core
          git commit -m "chore(deps): atualizar agnostic-core para ${NEW_VERSION}"
          git push origin "$BRANCH"

          {
            echo "## Atualizacao do agnostic-core"
            echo
            echo "**Versao anterior:** ${OLD_VERSION} (\`${OLD_SHORT}\`)"
            echo "**Versao nova:** ${NEW_VERSION} (\`${NEW_SHORT}\`)"
            echo
            echo "### O que mudou"
            echo
            echo '```'
            cat "$RUNNER_TEMP/changelog.txt"
            echo '```'
            echo
            echo "> Revise as mudancas antes de fazer merge."
            echo "> Para detalhes completos, veja o CHANGELOG no submodulo: \`.agnostic-core/CHANGELOG.md\`"
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --title "chore(deps): atualizar agnostic-core para ${NEW_VERSION}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
